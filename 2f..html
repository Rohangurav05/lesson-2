<!DOCTYPE html>
<html>
<head>
    <title>Amazon Product</title>

    <style>
        .product {
            width: 500px;
            padding: 20px;
            border: 1px solid black;
        }

        .back {
            color: darkteal;
            font-size: 20px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
        }

        .price {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }

        .delivery {
            font-size: 22px;
        }

        .cart {
            background-color: gold;
            border: none;
            border-radius: 25px;
            padding: 12px 40px;
            font-size: 18px;
            cursor: pointer;
        }

        .buy {
            background-color: orange;
            border: none;
            border-radius: 25px;
            padding: 12px 45px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="product">
        <a href="https://www.amazon.com" class="back">Back to Amazon</a>

        <h1 class="title">Nike Black Running Shoes</h1>

        <p class="price"> $39 - in stock.</p>

        <p class="delivery">Free delivery tomorrow. </p>

        <button class="cart"> Add to Cart</button>

        <button class="buy">Buy now</button>

    </div>
</body>
</html>
